<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b88a"/>
      <stop offset="100%" stop-color="#8a9a6b"/>
    </linearGradient>
    <linearGradient id="g2" x1="14" y1="10" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4cab0"/>
      <stop offset="100%" stop-color="#b0a47a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect width="48" height="48" rx="12" stroke="url(#g1)" stroke-width="0.8" opacity="0.3"/>

  <!-- Outer tracking ring -->
  <circle cx="24" cy="24" r="16" stroke="url(#g1)" stroke-width="1.2" opacity="0.15"/>

  <!-- Progress arc (~270deg filled) -->
  <path
    d="M24 8 A16 16 0 1 1 8 24"
    stroke="url(#g1)"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
    filter="url(#glow)"
  />

  <!-- Inner play triangle (stylized A shape) -->
  <path
    d="M19 14.5 L19 33.5 L36 24 Z"
    fill="none"
    stroke="url(#g2)"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Horizontal bar crossing the A — makes it read as "A" -->
  <line x1="19" y1="27" x2="30.5" y2="21" stroke="url(#g2)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Small tracking dot at the arc tip -->
  <circle cx="8" cy="24" r="2.5" fill="#b0a47a" opacity="0.9" filter="url(#glow)"/>

  <!-- Subtle tick marks on the ring -->
  <line x1="24" y1="7" x2="24" y2="9.5" stroke="#b0a47a" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="41" y1="24" x2="38.5" y2="24" stroke="#b0a47a" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="24" y1="41" x2="24" y2="38.5" stroke="#b0a47a" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>